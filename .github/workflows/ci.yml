name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version: '1.25'
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version: '1.25'
      - run: go test -race -cover -coverprofile=coverage.out ./...
      - name: Check coverage gate (30%)
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${total}%"
          threshold=30
          if (( $(echo "$total < $threshold" | bc -l) )); then
            echo "Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version: '1.25'
      - run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" ./cmd/server/

  docker:
    name: Build and push Docker image
    if: github.event_name == 'push'
    needs: [lint, test, build]
    uses: acdgbrasil/.github/.github/workflows/reusable-ghcr-build-push.yml@main
    with:
      service: svc-analysis-bi
    permissions:
      contents: read
      packages: write

  sbom:
    name: SBOM
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, build]
    uses: acdgbrasil/.github/.github/workflows/reusable-sbom.yml@main
    permissions:
      contents: write

# NOTA: o Kodus (review de IA) foi DESCONTINUADO no projeto. O job `kodus-review`
# e o reusable workflow `reusable-kodus-review.yml` da org foram removidos — não
# há o que reativar. Se um dia entrar outra ferramenta de review automatizado,
# ela vem como job novo.
